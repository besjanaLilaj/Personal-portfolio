name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        shell: powershell
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install GitHub CLI
        shell: powershell
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            winget install --id GitHub.cli --exact --accept-source-agreements --accept-package-agreements
          }

          $ghPath = "C:\Program Files\GitHub CLI"

          if (Test-Path $ghPath) {
            $env:PATH += ";$ghPath"
          }

          gh --version

      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t "personalportfolio:${{ steps.vars.outputs.short_sha }}" .

      - name: Save Docker image
        shell: powershell
        run: |
          docker save "personalportfolio:${{ steps.vars.outputs.short_sha }}" `
            -o "personalportfolio-${{ steps.vars.outputs.short_sha }}.tar"

      - name: Compress Docker image
        shell: powershell
        run: |
          Compress-Archive `
            -Path "personalportfolio-${{ steps.vars.outputs.short_sha }}.tar" `
            -DestinationPath "personalportfolio-${{ steps.vars.outputs.short_sha }}.zip"

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.vars.outputs.short_sha }}" `
            "personalportfolio-${{ steps.vars.outputs.short_sha }}.zip" `
            --title "Release ${{ steps.vars.outputs.short_sha }}" `
            --generate-notes