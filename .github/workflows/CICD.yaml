name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        shell: bash
        run: |
          shortSha="${GITHUB_SHA:0:7}"
          echo "short_sha=$shortSha" >> "$GITHUB_OUTPUT"

      - name: Check GitHub CLI
        run: |
          gh --version

      - name: Build Docker image
        run: |
          docker build \
            -t "personalportfolio:${{ steps.vars.outputs.short_sha }}" \
            .

      - name: Save Docker image
        run: |
          docker save \
            "personalportfolio:${{ steps.vars.outputs.short_sha }}" \
            -o "personalportfolio-${{ steps.vars.outputs.short_sha }}.tar"

      - name: Compress Docker image
        run: |
          gzip "personalportfolio-${{ steps.vars.outputs.short_sha }}.tar"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${{ steps.vars.outputs.short_sha }}" \
            "personalportfolio-${{ steps.vars.outputs.short_sha }}.tar.gz" \
            --title "Release ${{ steps.vars.outputs.short_sha }}" \
            --generate-notes


  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4